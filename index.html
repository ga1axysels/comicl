<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Comicle</title>
<meta name="description" content="Daily doodle: 4 panels, finish the comic.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ HOME ============ -->
<section id="home" class="screen">
  <div class="squiggles" id="squiggles" aria-hidden="true"></div>
  <main class="home-inner">
    <h1 class="logo">comicle</h1>
    <p class="tagline">daily doodle</p>
    <p class="sub">4 panels, finish the comic</p>
    <button id="startBtn" class="btn btn-primary btn-big">Start</button>
    <div id="titleCard" class="title-card">
      <div class="tc-content">
        <span class="tc-meta" id="tcMeta"></span>
        <span class="tc-title" id="tcTitle"></span>
        <span class="tc-hint">today's comic</span>
      </div>
    </div>
    <button id="homeRecent" class="link-btn" hidden>View recent comics</button>
  </main>
</section>

<!-- ============ DRAWING ============ -->
<section id="draw" class="screen" hidden>
  <div class="draw-top" id="drawTop">
    <button class="logo logo-small" id="drawLogo" aria-label="Go to home">comicle</button>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <button id="backBtn" class="btn btn-ghost back-btn" aria-label="Go back to the previous panel">
      <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Back
    </button>
  </div>

  <div id="viewport"><div id="track"></div></div>

  <div class="mobile-bar" id="mobileBar">
    <button class="icon-btn" id="mUndo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5"/><path d="M4 11h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="icon-btn" id="mRedo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 6l5 5-5 5"/><path d="M20 11H9a5 5 0 0 0 0 10h3"/></svg></button>
    <button class="btn btn-ghost addons-btn" id="addonsBtn"><span class="cur-color"></span>Add-ons</button>
    <button class="btn btn-primary" id="mDone">Done ✓</button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-scrim" id="sheetScrim"></div>
    <div class="sheet-body">
      <div class="sheet-head"><strong>Add-ons</strong><button class="text-btn" id="sheetClose">Close</button></div>
      <div id="sheetSlot"></div>
    </div>
  </div>

  <!-- One toolbar, moved into the active panel (desktop) or the add-ons sheet (phone) -->
  <div id="toolbar" class="toolbar">
    <div class="tb-group">
      <div class="tools">
        <button class="tool on" data-tool="brush" aria-label="Brush"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.4L16 4.8l3.2 3.2L8.4 18.8z"/><path d="M14 7l3 3"/></svg>Brush</button>
        <button class="tool" data-tool="eraser" aria-label="Eraser"><svg viewBox="0 0 24 24"><path d="M9 20h11"/><path d="M4.5 15.5l9-9a1.5 1.5 0 0 1 2 0l3.5 3.5a1.5 1.5 0 0 1 0 2L12 19H8z"/><path d="M9 11l5 5"/></svg>Eraser</button>
        <button class="tool" data-tool="fill" aria-label="Fill bucket"><svg viewBox="0 0 24 24"><path d="M4 12l7-7 7 7-7 7z"/><path d="M4 12h14"/><path d="M20.5 16.5c0 1.2-.8 2-1.5 2s-1.5-.8-1.5-2c0-1 1.5-3 1.5-3s1.5 2 1.5 3z"/></svg>Fill</button>
      </div>
      <div class="tb-row">
        <button class="icon-btn" id="undoBtn" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 6L4 11l5 5"/><path d="M4 11h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button class="icon-btn" id="redoBtn" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 6l5 5-5 5"/><path d="M20 11H9a5 5 0 0 0 0 10h3"/></svg></button>
        <button class="text-btn" id="clearBtn">Clear panel</button>
      </div>
    </div>

    <div class="tb-group">
      <h4>Bubbles <small>drag onto panel</small></h4>
      <div class="bubbles-row" id="bubbleBtns"></div>
    </div>

    <div class="tb-group">
      <h4>Colour <span class="cur-color"></span></h4>
      <div class="picker" id="picker"><canvas id="svBox" width="240" height="140"></canvas><span class="sv-knob" id="svKnob"></span></div>
      <input type="range" id="hue" class="hue" min="0" max="359" value="0" aria-label="Hue">
      <div class="swatches" id="swatches"></div>
    </div>

    <div class="tb-group">
      <h4>Size <span class="size-dot-wrap"><span class="size-dot" id="sizeDot"></span></span></h4>
      <input type="range" id="size" class="rng" min="2" max="80" value="10" aria-label="Brush size">
    </div>

    <div class="tb-group">
      <h4>Transparency <span id="opVal">100%</span></h4>
      <input type="range" id="opacity" class="rng" min="5" max="100" value="100" aria-label="Brush opacity">
    </div>
  </div>
</section>

<!-- ============ RESULT ============ -->
<section id="result" class="screen" hidden>
  <header class="res-top">
    <button class="logo logo-small" id="resLogo" aria-label="Go to home">comicle</button>
    <span class="res-meta" id="resMeta"></span>
  </header>

  <div class="res-main">
    <aside class="custom" id="customPanel" hidden>
      <h3>Background</h3>
      <div class="border-swatches" id="borderSwatches"></div>
      <h3>Shape</h3>
      <div class="shape-row">
        <button class="shape-btn" data-layout="vertical" aria-label="Vertical strip">
          <svg viewBox="0 0 30 60"><rect x="6" y="3" width="18" height="54" rx="2"/><path d="M9 7h12v10H9zM9 20h12v10H9zM9 33h12v10H9zM9 46h12v8H9z"/></svg>Vertical
        </button>
        <button class="shape-btn" data-layout="grid" aria-label="Two by two grid">
          <svg viewBox="0 0 60 60"><rect x="6" y="6" width="48" height="48" rx="2"/><path d="M10 14h18v18H10zM32 14h18v18H32zM10 35h18v15H10zM32 35h18v15H32z"/></svg>2 × 2
        </button>
      </div>
      <button class="btn btn-ghost" id="customDone">Done</button>
    </aside>

    <div class="dispenser" id="dispenser">
      <div class="slot"></div>
      <div class="strip-clip">
        <div class="strip" id="strip">
          <input class="strip-title" id="stripTitle" aria-label="Comic title" maxlength="40">
          <div class="strip-panels" id="stripPanels"></div>
          <div class="strip-by">
            <label for="byInput">by</label>
            <input id="byInput" placeholder="your name" maxlength="24">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="res-after" id="resAfter">
    <div class="res-actions">
      <button class="btn btn-ghost" id="customizeBtn">Customize more</button>
      <div class="share">
        <span class="share-label">Share with</span>
        <button class="btn btn-ghost" data-share="download">Download</button>
        <button class="btn btn-ghost" data-share="link">Copy link</button>
        <button class="btn btn-ghost" data-share="instagram">Instagram</button>
        <button class="btn btn-ghost" data-share="messages">Messages</button>
      </div>
    </div>

    <section class="recent">
      <h2>View recent comics</h2>
      <div class="recent-grid" id="recentGrid"></div>
    </section>
  </div>
</section>

<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
